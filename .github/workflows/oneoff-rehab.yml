name: One-off rehab tracker update

on:
  push:
    paths:
      - '.github/workflows/oneoff-rehab.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch OD tracker
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('torn-od-tracker.user.js')
          s = p.read_text()

          s = s.replace('// @version      0.8.6', '// @version      0.8.7', 1)

          old = '''  function getDrugStats(response) {
    const drugs = response?.personalstats?.drugs;
    if (!drugs) return null;
    return { xanax: Number(drugs.xanax) || 0, overdoses: Number(drugs.overdoses) || 0, total: Number(drugs.total) || 0 };
  }
'''
          new = '''  function getDrugStats(response) {
    const drugs = response?.personalstats?.drugs;
    if (!drugs) return null;
    return {
      xanax: Number(drugs.xanax) || 0,
      overdoses: Number(drugs.overdoses) || 0,
      total: Number(drugs.total) || 0,
      rehabs: Number(drugs.rehabs) || 0,
      rehabCost: Number(drugs.rehabcost) || 0
    };
  }

  function getFactionRehabCostReduction(response) {
    const branches = [
      ...(Array.isArray(response?.upgrades?.peace) ? response.upgrades.peace : []),
      ...(Array.isArray(response?.upgrades?.war) ? response.upgrades.war : [])
    ];
    let reduction = 0;
    let detected = false;

    for (const branch of branches) {
      for (const upgrade of (Array.isArray(branch?.upgrades) ? branch.upgrades : [])) {
        const text = String(upgrade?.name || '') + ' ' + String(upgrade?.ability || '');
        if (/rehab/i.test(text) && /cost|reduce/i.test(text)) {
          reduction = Math.min(20, Math.max(0, Number(upgrade?.level) || 0) * 2);
          detected = true;
        }
      }
    }

    return { reduction, detected };
  }

  function getCurrentBrainDebuff() {
    const nodes = Array.from(document.querySelectorAll('[title], [aria-label], img[alt]'));
    for (const node of nodes) {
      const label = String(node.getAttribute('title') || node.getAttribute('aria-label') || node.getAttribute('alt') || '');
      if (!/brain|addiction/i.test(label)) continue;
      const match = label.match(/-\s*(\d+(?:\.\d+)?)\s*%/);
      if (match) return Number(match[1]);
    }
    return null;
  }

  function calculateRehabEstimate(data) {
    const stats = data.odChance?.drugStats;
    if (!stats) return null;

    const rehabs = Math.max(0, Number(stats.rehabs) || 0);
    const factionReduction = Math.min(20, Math.max(0, Number(data.odChance?.rehabCostReduction) || 0));
    const baseSessionCost = 250000;
    const sessionCost = Math.round(baseSessionCost * (1 - factionReduction / 100));
    const costPerAP = Math.min(baseSessionCost, 2857 + (12.85 * rehabs));
    const apPerSession = baseSessionCost / costPerAP;
    const currentBrainDebuff = getCurrentBrainDebuff();

    return {
      rehabs,
      lifetimeCost: Math.max(0, Number(stats.rehabCost) || 0),
      factionReduction,
      sessionCost,
      costPerAP,
      apPerSession,
      currentBrainDebuff
    };
  }
'''
          if old not in s:
              raise SystemExit('getDrugStats block not found')
          s = s.replace(old, new, 1)

          old = 'odChance: { drugStats: null, factionReduction: 0, factionDetected: false, nightclub7: false, nightclubDetected: false, lastChecked: null, error: null }'
          new = 'odChance: { drugStats: null, factionReduction: 0, factionDetected: false, nightclub7: false, nightclubDetected: false, rehabCostReduction: 0, rehabCostDetected: false, lastChecked: null, error: null }'
          if old not in s:
              raise SystemExit('default odChance block not found')
          s = s.replace(old, new, 1)

          old = '''    const faction = !upgradesResponse?.error ? getFactionODReduction(upgradesResponse) : { reduction: 0, detected: false };
    if (stats) data.odChance.drugStats = stats;
'''
          new = '''    const faction = !upgradesResponse?.error ? getFactionODReduction(upgradesResponse) : { reduction: 0, detected: false };
    const rehabFaction = !upgradesResponse?.error ? getFactionRehabCostReduction(upgradesResponse) : { reduction: 0, detected: false };
    if (stats) data.odChance.drugStats = stats;
'''
          if old not in s:
              raise SystemExit('refresh faction block not found')
          s = s.replace(old, new, 1)

          old = '''    if (faction.detected) {
      data.odChance.factionReduction = faction.reduction;
      data.odChance.factionDetected = true;
    }
    data.odChance.lastChecked = new Date().toISOString();
'''
          new = '''    if (faction.detected) {
      data.odChance.factionReduction = faction.reduction;
      data.odChance.factionDetected = true;
    }
    if (rehabFaction.detected) {
      data.odChance.rehabCostReduction = rehabFaction.reduction;
      data.odChance.rehabCostDetected = true;
    }
    data.odChance.lastChecked = new Date().toISOString();
'''
          if old not in s:
              raise SystemExit('refresh save block not found')
          s = s.replace(old, new, 1)

          old = '''      #${ROOT_ID} .odt-chance-note { margin-top:8px; font-size:10px; opacity:.65; }
      #${ROOT_ID} .odt-key-builder'''
          new = '''      #${ROOT_ID} .odt-chance-note { margin-top:8px; font-size:10px; opacity:.65; }
      #${ROOT_ID} .odt-rehab { margin-top:10px; border-top:1px solid #333; padding-top:9px; }
      #${ROOT_ID} .odt-rehab-header { width:100%; border:0; background:none; color:#ddd; text-align:left; padding:3px 0; font-size:12px; font-weight:600; }
      #${ROOT_ID} .odt-rehab-grid { display:grid; grid-template-columns:1fr auto; gap:4px 8px; margin-top:7px; }
      #${ROOT_ID} .odt-rehab-value { text-align:right; color:#fff; font-weight:600; }
      #${ROOT_ID} .odt-rehab-note { margin-top:8px; font-size:10px; opacity:.65; }
      #${ROOT_ID} .odt-key-builder'''
          if old not in s:
              raise SystemExit('style insertion point not found')
          s = s.replace(old, new, 1)

          old = '''    } else {
      root.querySelector(".odt-per-dose").textContent = "Unavailable";
      root.querySelector(".odt-cumulative").textContent = "Unavailable";
      root.querySelector(".odt-faction").textContent = "Unavailable";'''
          # Leave existing OD rendering untouched; insert rehab rendering immediately before the history block.
          marker = '''    const h = root.querySelector(".odt-history");
'''
          rehab_render = '''    const rehab = calculateRehabEstimate(data);
    if (rehab) {
      root.querySelector(".odt-rehabs").textContent = rehab.rehabs.toLocaleString("en-GB");
      root.querySelector(".odt-session-cost").textContent = "$" + rehab.sessionCost.toLocaleString("en-US");
      root.querySelector(".odt-rehab-lifetime").textContent = rehab.lifetimeCost > 0 ? "$" + rehab.lifetimeCost.toLocaleString("en-US") : "Unavailable";
      root.querySelector(".odt-cost-ap").textContent = "$" + Math.round(rehab.costPerAP).toLocaleString("en-US") + "/AP";
      root.querySelector(".odt-brain-status").textContent = rehab.currentBrainDebuff === null
        ? "Not detected"
        : "-" + rehab.currentBrainDebuff + "% BSR";
    } else {
      root.querySelector(".odt-rehabs").textContent = "Unavailable";
      root.querySelector(".odt-session-cost").textContent = "Unavailable";
      root.querySelector(".odt-rehab-lifetime").textContent = "Unavailable";
      root.querySelector(".odt-cost-ap").textContent = "Unavailable";
      root.querySelector(".odt-brain-status").textContent = "Unavailable";
    }

'''
          if marker not in s:
              raise SystemExit('render marker not found')
          s = s.replace(marker, rehab_render + marker, 1)

          old = '''        </div>

        <button class="odt-action odt-api-test" data-action="test-api" style="width:100%;">🧪 Test OD data access</button>'''
          new = '''        </div>
        <div class="odt-rehab">
          <div class="odt-rehab-header">🏥 Rehab Estimate</div>
          <div class="odt-rehab-grid">
            <span>Lifetime rehabs</span><span class="odt-rehab-value odt-rehabs">Checking…</span>
            <span>Current rehab session</span><span class="odt-rehab-value odt-session-cost">Checking…</span>
            <span>Lifetime rehab spend</span><span class="odt-rehab-value odt-rehab-lifetime">Checking…</span>
            <span>Current cost per addiction point</span><span class="odt-rehab-value odt-cost-ap">Checking…</span>
            <span>Brain icon / battle-stat reduction</span><span class="odt-rehab-value odt-brain-status">Checking…</span>
          </div>
          <div class="odt-rehab-note">The API can show your lifetime rehab count and spend, while the faction data can show your current rehab-cost reduction. The brain icon is read only when it is present on the profile page; it is a battle-stat penalty indicator, not a direct addiction-point counter.</div>
          <div class="odt-muted" style="margin-top:6px;">Rehab efficiency decreases as lifetime rehab sessions increase. This is an estimate/guide, not a live Switzerland quote.</div>
        </div>

        <button class="odt-action odt-api-test" data-action="test-api" style="width:100%;">🧪 Test OD data access</button>'''
          if old not in s:
              raise SystemExit('markup insertion point not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Remove one-off workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-od-tracker.user.js
          git rm .github/workflows/oneoff-rehab.yml
          git commit -m 'Add rehab estimate to OD tracker'
          git push
