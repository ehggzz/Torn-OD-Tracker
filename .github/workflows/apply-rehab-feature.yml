name: Apply Rehab Feature Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch tracker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('torn-od-tracker.user.js')
          s = path.read_text(encoding='utf-8')
          if 'function getRehabStats(response)' in s:
              print('Rehab feature already present; nothing to do.')
              raise SystemExit(0)

          s = s.replace('// @version      0.8.6', '// @version      0.8.7', 1)

          marker = '  function getJobInfo(response) {'
          insert = '''  function getRehabStats(response) {
    const stats = response?.personalstats?.drugs || response?.personalstats;
    if (!stats) return null;
    const rehabs = Number(stats.rehabs);
    const rehabCost = Number(stats.rehabcost);
    if (!Number.isFinite(rehabs) && !Number.isFinite(rehabCost)) return null;
    return {
      rehabs: Number.isFinite(rehabs) ? Math.max(0, rehabs) : 0,
      rehabCost: Number.isFinite(rehabCost) ? Math.max(0, rehabCost) : 0
    };
  }

'''
          if marker not in s: raise SystemExit('Missing getJobInfo marker')
          s = s.replace(marker, insert + marker, 1)

          marker = '  function calculateODChance(data) {'
          insert = '''  function getFactionRehabReduction(response) {
    const branches = [
      ...(Array.isArray(response?.upgrades?.peace) ? response.upgrades.peace : []),
      ...(Array.isArray(response?.upgrades?.war) ? response.upgrades.war : [])
    ];
    let reduction = 0;
    let detected = false;
    for (const branch of branches) {
      for (const upgrade of (Array.isArray(branch?.upgrades) ? branch.upgrades : [])) {
        const text = String(upgrade?.name || '') + ' ' + String(upgrade?.ability || '');
        if (/rehab/i.test(text) && /cost|fee/i.test(text)) {
          reduction = Math.min(20, Math.max(0, (Number(upgrade?.level) || 0) * 2));
          detected = true;
        }
      }
    }
    return { reduction, detected };
  }

'''
          if marker not in s: raise SystemExit('Missing calculateODChance marker')
          s = s.replace(marker, insert + marker, 1)

          marker = '  const defaultData = {'
          insert = '''  function calculateRehabEstimate(data) {
    const stats = data.rehab?.stats;
    if (!stats) return null;
    const rehabs = Math.max(0, Number(stats.rehabs) || 0);
    const rehabReduction = Math.min(20, Math.max(0, Number(data.rehab?.factionReduction) || 0));
    const currentSessionCost = 250000 * (1 - rehabReduction / 100);
    const costPerAPBeforeFaction = 2857 + (12.85 * rehabs);
    const apPerSession = Math.max(1, 250000 / costPerAPBeforeFaction);
    const costPerAP = costPerAPBeforeFaction * (1 - rehabReduction / 100);
    const estimatedXanaxCost = costPerAP * 35;
    const averageHistoricalCost = rehabs > 0 ? (Number(stats.rehabCost) || 0) / rehabs : null;
    return { rehabs, rehabCost: Number(stats.rehabCost) || 0, rehabReduction, currentSessionCost, apPerSession, costPerAP, estimatedXanaxCost, averageHistoricalCost };
  }

'''
          if marker not in s: raise SystemExit('Missing defaultData marker')
          s = s.replace(marker, insert + marker, 1)

          old = '''    odChance: { drugStats: null, factionReduction: 0, factionDetected: false, nightclub7: false, nightclubDetected: false, lastChecked: null, error: null }
  };'''
          new = '''    odChance: { drugStats: null, factionReduction: 0, factionDetected: false, nightclub7: false, nightclubDetected: false, lastChecked: null, error: null },
    rehab: { stats: null, factionReduction: 0, factionDetected: false, lastChecked: null, error: null }
  };'''
          if old not in s: raise SystemExit('Missing defaultData block')
          s = s.replace(old, new, 1)

          old = '''    data.odChance = data.odChance || { ...defaultData.odChance };
    const stats = !drugResponse?.error ? getDrugStats(drugResponse) : null;
    const job = !jobResponse?.error ? getJobInfo(jobResponse) : null;
    const faction = !upgradesResponse?.error ? getFactionODReduction(upgradesResponse) : { reduction: 0, detected: false };'''
          new = '''    data.odChance = data.odChance || { ...defaultData.odChance };
    data.rehab = data.rehab || { ...defaultData.rehab };
    const stats = !drugResponse?.error ? getDrugStats(drugResponse) : null;
    const rehabStats = !drugResponse?.error ? getRehabStats(drugResponse) : null;
    const job = !jobResponse?.error ? getJobInfo(jobResponse) : null;
    const faction = !upgradesResponse?.error ? getFactionODReduction(upgradesResponse) : { reduction: 0, detected: false };
    const rehabFaction = !upgradesResponse?.error ? getFactionRehabReduction(upgradesResponse) : { reduction: 0, detected: false };'''
          if old not in s: raise SystemExit('Missing refresh block')
          s = s.replace(old, new, 1)

          old = '''    if (faction.detected) {
      data.odChance.factionReduction = faction.reduction;
      data.odChance.factionDetected = true;
    }
    data.odChance.lastChecked = new Date().toISOString();
    data.odChance.error = null;'''
          new = '''    if (faction.detected) {
      data.odChance.factionReduction = faction.reduction;
      data.odChance.factionDetected = true;
    }
    if (rehabStats) data.rehab.stats = rehabStats;
    if (rehabFaction.detected) {
      data.rehab.factionReduction = rehabFaction.reduction;
      data.rehab.factionDetected = true;
    }
    data.odChance.lastChecked = new Date().toISOString();
    data.rehab.lastChecked = new Date().toISOString();
    data.odChance.error = null;
    data.rehab.error = null;'''
          if old not in s: raise SystemExit('Missing refresh tail')
          s = s.replace(old, new, 1)

          marker = '    const apiKeyButton = root.querySelector(".odt-api-key-button");'
          insert = '''    const rehab = calculateRehabEstimate(data);
    const rehabFields = {
      'rehab-count': rehab ? rehab.rehabs.toLocaleString('en-GB') : 'Unavailable',
      'rehab-session-cost': rehab ? `$${Math.round(rehab.currentSessionCost).toLocaleString('en-GB')}` : 'Unavailable',
      'rehab-spend': rehab ? `$${Math.round(rehab.rehabCost).toLocaleString('en-GB')}` : 'Unavailable',
      'rehab-ap': rehab ? rehab.apPerSession.toFixed(1) + ' AP' : 'Unavailable',
      'rehab-ap-cost': rehab ? `$${Math.round(rehab.costPerAP).toLocaleString('en-GB')}/AP` : 'Unavailable',
      'rehab-xanax': rehab ? `$${Math.round(rehab.estimatedXanaxCost).toLocaleString('en-GB')}` : 'Unavailable',
      'rehab-reduction': rehab ? rehab.rehabReduction + '%' : 'Unavailable'
    };
    for (const [cls, value] of Object.entries(rehabFields)) {
      const el = root.querySelector('.' + cls);
      if (el) el.textContent = value;
    }
    const rehabNote = root.querySelector('.odt-rehab-note');
    if (rehabNote) {
      rehabNote.textContent = rehab
        ? 'This estimates rehab economics from your lifetime rehab count. Your exact current addiction level is not exposed by the API, so it cannot say exactly how many sessions you need right now.'
        : 'Rehab data unavailable from the current API key.';
    }

'''
          if marker not in s: raise SystemExit('Missing render marker')
          s = s.replace(marker, insert + marker, 1)

          marker = '      #${ROOT_ID} .odt-api-test { margin-top:7px; }'
          insert = '''      #${ROOT_ID} .odt-rehab { margin-top:10px; border-top:1px solid #333; padding-top:9px; }
      #${ROOT_ID} .odt-rehab-header { width:100%; border:0; background:none; color:#ddd; text-align:left; padding:3px 0; font-size:12px; font-weight:600; cursor:pointer; }
      #${ROOT_ID} .odt-rehab-body { display:none; margin-top:7px; }
      #${ROOT_ID} .odt-rehab-body.open { display:block; }
      #${ROOT_ID} .odt-rehab-grid { display:grid; grid-template-columns:1fr auto; gap:4px 8px; }
      #${ROOT_ID} .odt-rehab-value { text-align:right; color:#fff; font-weight:600; }
      #${ROOT_ID} .odt-rehab-note { margin-top:8px; font-size:10px; opacity:.65; }
'''
          if marker not in s: raise SystemExit('Missing CSS marker')
          s = s.replace(marker, insert + marker, 1)

          marker = '        <button class="odt-action odt-api-test" data-action="test-api" style="width:100%;">🧪 Test OD data access</button>'
          insert = '''        <div class="odt-rehab">
          <button class="odt-rehab-header" type="button">🏥 Rehab Estimate <span class="odt-rehab-arrow" style="float:right;opacity:.7;">▾</span></button>
          <div class="odt-rehab-body">
            <div class="odt-rehab-grid">
              <span>Lifetime rehabs</span><span class="odt-rehab-value rehab-count">Checking…</span>
              <span>Current cost per rehab</span><span class="odt-rehab-value rehab-session-cost">Checking…</span>
              <span>Lifetime rehab spend</span><span class="odt-rehab-value rehab-spend">Checking…</span>
              <span>Estimated AP removed per rehab</span><span class="odt-rehab-value rehab-ap">Checking…</span>
              <span>Estimated cost per AP</span><span class="odt-rehab-value rehab-ap-cost">Checking…</span>
              <span>Estimated rehab cost per Xanax</span><span class="odt-rehab-value rehab-xanax">Checking…</span>
              <span>Faction rehab reduction</span><span class="odt-rehab-value rehab-reduction">Checking…</span>
            </div>
            <div class="odt-rehab-note">Checking rehab data…</div>
            <div class="odt-muted" style="margin-top:6px;">The rehab cost/AP formula is community-validated. It is an estimate, not an official Torn calculation.</div>
          </div>
        </div>

'''
          if marker not in s: raise SystemExit('Missing HTML marker')
          s = s.replace(marker, insert + marker, 1)

          marker = '    const chanceHeader = root.querySelector(".odt-chance-header");'
          insert = '''    const rehabHeader = root.querySelector(".odt-rehab-header");
    const rehabBody = root.querySelector(".odt-rehab-body");
    rehabHeader.addEventListener("click", () => {
      const open = rehabBody.classList.toggle("open");
      root.querySelector(".odt-rehab-arrow").textContent = open ? "▴" : "▾";
    });

'''
          if marker not in s: raise SystemExit('Missing event marker')
          s = s.replace(marker, insert + marker, 1)

          path.write_text(s, encoding='utf-8')
          print('Rehab feature patch applied.')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-od-tracker.user.js
          git commit -m 'Add rehab cost estimate to OD tracker' || exit 0
          git push