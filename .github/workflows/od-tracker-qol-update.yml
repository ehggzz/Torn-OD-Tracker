name: Apply OD Tracker QoL update

on:
  push:
    paths:
      - '.github/workflows/od-tracker-qol-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply QoL change
        shell: python
        run: |
          from pathlib import Path

          path = Path('torn-od-tracker.user.js')
          text = path.read_text(encoding='utf-8')

          if '@version      0.8.6' not in text:
              raise SystemExit('Expected version 0.8.6 was not found; refusing to modify the file.')

          text = text.replace('@version      0.8.6', '@version      0.8.7', 1)

          old_duration = '''  function formatDuration(ms) {
    if (!Number.isFinite(ms) || ms < 0) return "0m";
    const totalMinutes = Math.floor(ms / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    if (days > 0) return `${days}d ${hours}h ${minutes}m`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${minutes}m`;
  }
'''

          new_duration = old_duration + '''
  function formatCompactDuration(ms) {
    if (!Number.isFinite(ms) || ms < 0) return "0m";
    const totalHours = Math.floor(ms / 3600000);
    const days = Math.floor(totalHours / 24);
    const hours = totalHours % 24;
    const minutes = Math.floor((ms % 3600000) / 60000);
    if (days > 0) return `${days}d ${hours}h`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${minutes}m`;
  }
'''

          if old_duration not in text:
              raise SystemExit('Expected formatDuration block was not found; refusing to modify the file.')
          text = text.replace(old_duration, new_duration, 1)

          old_xanax = '''    root.querySelector(".odt-xanax").textContent =
      `💊 Xanax since OD: ${Number(data.xanaxSinceOD) || 0}`;
'''

          new_xanax = '''    const xanax = Number(data.xanaxSinceOD) || 0;
    const elapsed = formatCompactDuration(Date.now() - new Date(data.lastOD).getTime());
    root.querySelector(".odt-xanax").textContent =
      `💊 ${xanax.toLocaleString("en-GB")} Xan · ${elapsed} between ODs`;
'''

          if old_xanax not in text:
              raise SystemExit('Expected Xanax display block was not found; refusing to modify the file.')
          text = text.replace(old_xanax, new_xanax, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/od-tracker-qol-update.yml
          git add torn-od-tracker.user.js
          git commit -m "feat: show Xanax interval duration"
          git push
