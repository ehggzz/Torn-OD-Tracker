name: Apply OD Tracker history interval fix

on:
  push:
    paths:
      - '.github/workflows/od-tracker-qol-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move OD interval to the older history entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('torn-od-tracker.user.js')
          text = path.read_text(encoding='utf-8')

          if '@version      0.8.8' not in text:
              raise SystemExit('Expected version 0.8.8 was not found; refusing to modify the file.')

          old = '''            const olderEntry = data.history[i + 1];
            const gap = olderEntry
              ? `<span class="odt-history-gap">• ${formatCompactDuration(new Date(entry.od).getTime() - new Date(olderEntry.od).getTime())} between ODs</span>`
              : "";
            return `<div class="odt-history-row">${i + 1}. ${formatDate(entry.od)} ${xanax} ${gap}</div>`;
'''

          new = '''            const newerEntry = data.history[i - 1];
            const gap = newerEntry
              ? `<span class="odt-history-gap">• ${formatCompactDuration(new Date(newerEntry.od).getTime() - new Date(entry.od).getTime())} between ODs</span>`
              : "";
            return `<div class="odt-history-row">${i + 1}. ${formatDate(entry.od)} ${xanax} ${gap}</div>`;
'''

          if old not in text:
              raise SystemExit('Expected history interval block was not found; refusing to modify the file.')

          text = text.replace(old, new, 1)
          text = text.replace('@version      0.8.8', '@version      0.8.9', 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/od-tracker-qol-update.yml
          git add torn-od-tracker.user.js
          git commit -m "fix: align OD interval with older history entry"
          git push
